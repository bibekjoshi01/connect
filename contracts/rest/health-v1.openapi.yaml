openapi: 3.1.0
info:
  title: Connect operational endpoints
  version: 1.1.0
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Process is serving HTTP; does not assert database or call readiness
      responses:
        '200':
          description: Process alive
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    const: ok
  /readyz:
    get:
      operationId: getReadiness
      summary: PostgreSQL is reachable and the expected migration version is applied
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    const: ready
        '503':
          description: Database unavailable, query timed out, or schema not current
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    const: unavailable
  /metrics:
    get:
      operationId: getOperationalMetrics
      summary: Fixed operational counters and database pool gauges without user labels
      responses:
        '200':
          description: Prometheus text exposition; keep private
          content:
            text/plain:
              schema:
                type: string
